name: Create or update pull request

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: Branch to merge from
        required: true
        type: string
      target-branch:
        description: Branch to merge into
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare-pull-request:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['source-branch'] }}
          fetch-depth: 0

      - name: Validate pull request branches
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs['source-branch'] }}
          TARGET_BRANCH: ${{ inputs['target-branch'] }}
        run: |
          if [[ "$SOURCE_BRANCH" == "$TARGET_BRANCH" ]]; then
            echo "Source and target branches must be different" >&2
            exit 1
          fi
          git rev-parse --verify "origin/$SOURCE_BRANCH^{commit}" >/dev/null
          git rev-parse --verify "origin/$TARGET_BRANCH^{commit}" >/dev/null

      - name: Resolve pull request comparison
        id: comparison
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs['source-branch'] }}
          TARGET_BRANCH: ${{ inputs['target-branch'] }}
        run: |
          echo "base=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          base_sha="$(git rev-parse "origin/$TARGET_BRANCH^{commit}")"
          head_sha="$(git rev-parse "origin/$SOURCE_BRANCH^{commit}")"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Generate pull request body from the branch difference
        uses: ./
        with:
          comparison-base: ${{ steps.comparison.outputs.base-sha }}
          comparison-target: ${{ steps.comparison.outputs.head-sha }}
          release-name: ${{ steps.comparison.outputs.head }} into ${{ steps.comparison.outputs.base }}
          language: en
          dry-run: 'true'
          fail-on-llm-error: 'true'
          template-file: .github/PULL_REQUEST_TEMPLATE/release.md
          output-file: ${{ runner.temp }}/pull-request-body.md

      - name: Create or update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.comparison.outputs.head }}
          TARGET_BRANCH: ${{ steps.comparison.outputs.base }}
          NOTES_FILE: ${{ runner.temp }}/pull-request-body.md
        run: |
          pr_number="$(gh pr list --state open --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --body-file "$NOTES_FILE"
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "Merge $SOURCE_BRANCH into $TARGET_BRANCH" \
              --body-file "$NOTES_FILE"
          fi

  update-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate pull request body from the branch difference
        uses: ./
        with:
          comparison-base: ${{ github.event.pull_request.base.sha }}
          comparison-target: ${{ github.event.pull_request.head.sha }}
          release-name: ${{ github.event.pull_request.title }}
          language: en
          dry-run: 'true'
          fail-on-llm-error: 'true'
          template-file: .github/PULL_REQUEST_TEMPLATE/release.md
          output-file: ${{ runner.temp }}/pull-request-body.md

      - name: Update pull request body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NOTES_FILE: ${{ runner.temp }}/pull-request-body.md
        run: gh pr edit "$PR_NUMBER" --body-file "$NOTES_FILE"
