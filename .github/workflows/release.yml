name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+([.][0-9]+([.][0-9]+(-[0-9A-Za-z.-]+)?)?)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Use v1, v1.2, v1.2.3, or v1.2.3-rc.1." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify committed distribution
        run: git diff --exit-code -- dist/index.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_options=(
            "$RELEASE_TAG"
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG"
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "${release_options[@]}"
