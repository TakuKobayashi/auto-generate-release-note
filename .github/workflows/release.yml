name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose GitHub Release should be created or updated
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+([.][0-9]+([.][0-9]+(-[0-9A-Za-z.-]+)?)?)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Use v1, v1.2, v1.2.3, or v1.2.3-rc.1." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify committed distribution
        run: git diff --exit-code -- dist/index.js

      - name: Generate AI release notes and publish release
        id: release-notes
        uses: ./
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          language: en
          fail-on-llm-error: 'true'

      - name: Show published release
        env:
          RELEASE_URL: ${{ steps.release-notes.outputs.release-url }}
          PREVIOUS_TAG: ${{ steps.release-notes.outputs.previous-tag }}
          USED_LLM: ${{ steps.release-notes.outputs.used-llm }}
        run: |
          echo "Release: $RELEASE_URL"
          echo "Previous tag: ${PREVIOUS_TAG:-none}"
          echo "Generated by Ollama: $USED_LLM"
