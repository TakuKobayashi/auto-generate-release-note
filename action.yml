name: auto-generate-release-note
description: Generate and publish GitHub release notes from Git history with a local Ollama model
author: TakuKobayashi

inputs:
  tag:
    description: Release tag. Defaults to the tag that triggered the workflow
    required: false
    default: ${{ github.ref_name }}
  release-name:
    description: Display name used in generated notes and the GitHub Release; defaults to tag
    required: false
    default: ''
  comparison-base:
    description: Optional branch, tag, or commit used as an explicit comparison base
    required: false
    default: ''
  comparison-target:
    description: Optional branch, tag, or commit compared with comparison-base
    required: false
    default: ''
  model:
    description: Ollama model used to understand source-code changes
    required: false
    default: qwen2.5-coder:7b-instruct
  ollama-host:
    description: Ollama API base URL
    required: false
    default: http://127.0.0.1:11434
  language:
    description: Primary language used for release notes
    required: false
    default: en
  bilingual:
    description: Also include an English version when the selected language is not English
    required: false
    default: 'false'
  inference-timeout-seconds:
    description: Stop after this many seconds without activity after Ollama starts streaming
    required: false
    default: '600'
  fail-on-llm-error:
    description: Fail instead of publishing deterministic fallback notes when Ollama inference fails
    required: false
    default: 'false'
  dry-run:
    description: Generate and print notes without creating or updating a GitHub Release
    required: false
    default: 'false'
  output-file:
    description: Optional path where generated Markdown is written (especially useful with dry-run)
    required: false
    default: ''
  template-file:
    description: Optional Markdown template whose release-note section is populated by the model
    required: false
    default: ''

outputs:
  release-url:
    description: URL of the created or updated GitHub Release
    value: ${{ steps.release.outputs.release-url }}
  previous-tag:
    description: Previous semantic-version tag used as the comparison base
    value: ${{ steps.release.outputs.previous-tag }}
  comparison-base:
    description: Git ref used as the effective comparison base
    value: ${{ steps.release.outputs.comparison-base }}
  comparison-target:
    description: Git ref used as the effective comparison target
    value: ${{ steps.release.outputs.comparison-target }}
  used-llm:
    description: Whether the release body was generated by the configured model
    value: ${{ steps.release.outputs.used-llm }}

runs:
  using: composite
  steps:
    - name: Install Ollama when needed
      continue-on-error: ${{ inputs.fail-on-llm-error != 'true' }}
      shell: bash
      env:
        OLLAMA_HOST_URL: ${{ inputs.ollama-host }}
      run: |
        if curl --silent --fail "$OLLAMA_HOST_URL/api/tags" >/dev/null; then
          exit 0
        fi
        case "$OLLAMA_HOST_URL" in
          http://127.0.0.1:*|http://localhost:*) ;;
          *) echo "Ollama is not reachable at $OLLAMA_HOST_URL" >&2; exit 1 ;;
        esac
        if ! command -v ollama >/dev/null 2>&1; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi
        nohup ollama serve > "$RUNNER_TEMP/ai-release-notes-ollama.log" 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail "$OLLAMA_HOST_URL/api/tags" >/dev/null && exit 0
          sleep 2
        done
        echo "Ollama did not become ready" >&2
        exit 1

    - name: Pull release-notes model
      continue-on-error: ${{ inputs.fail-on-llm-error != 'true' }}
      shell: bash
      env:
        OLLAMA_HOST_URL: ${{ inputs.ollama-host }}
        OLLAMA_MODEL: ${{ inputs.model }}
      run: |
        payload=$(node -e 'process.stdout.write(JSON.stringify({model: process.env.OLLAMA_MODEL, stream: false}))')
        pull_response="$RUNNER_TEMP/ai-release-notes-model-pull.json"
        curl --show-error --silent \
          "$OLLAMA_HOST_URL/api/pull" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          --output "$pull_response"
        node -e '
          const fs = require("node:fs");
          const file = process.argv[1];
          const body = fs.readFileSync(file, "utf8");
          let result;
          try { result = JSON.parse(body); }
          catch { console.error(`Ollama returned invalid model-pull JSON: ${body}`); process.exit(1); }
          if (result.error || result.status !== "success") {
            console.error(`Ollama model pull failed: ${result.error || result.status || body}`);
            process.exit(1);
          }
          console.log(`Ollama model pull completed: ${result.status}`);
        ' "$pull_response"

        show_payload=$(node -e 'process.stdout.write(JSON.stringify({model: process.env.OLLAMA_MODEL}))')
        show_response="$RUNNER_TEMP/ai-release-notes-model-show.json"
        for attempt in $(seq 1 15); do
          curl --show-error --silent \
            "$OLLAMA_HOST_URL/api/show" \
            --header "Content-Type: application/json" \
            --data "$show_payload" \
            --output "$show_response"
          if node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.exit(result.error ? 1 : 0);
          ' "$show_response"; then
            echo "Ollama model is ready: $OLLAMA_MODEL"
            exit 0
          fi
          sleep 2
        done
        echo "Ollama model did not become available: $OLLAMA_MODEL" >&2
        cat "$show_response" >&2
        exit 1

    - name: Generate notes and publish GitHub Release
      id: release
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
        INPUT_COMPARISON_BASE: ${{ inputs.comparison-base }}
        INPUT_COMPARISON_TARGET: ${{ inputs.comparison-target }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_HOST: ${{ inputs.ollama-host }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_BILINGUAL: ${{ inputs.bilingual }}
        INPUT_INFERENCE_TIMEOUT_SECONDS: ${{ inputs.inference-timeout-seconds }}
        INPUT_FAIL_ON_LLM_ERROR: ${{ inputs.fail-on-llm-error }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_TEMPLATE_FILE: ${{ inputs.template-file }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

branding:
  icon: file-text
  color: blue
