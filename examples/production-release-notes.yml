name: Update production release notes

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate notes from the production branch difference
        uses: TakuKobayashi/auto-generate-release-note@v2
        with:
          comparison-base: ${{ github.event.pull_request.base.sha }}
          comparison-target: ${{ github.event.pull_request.head.sha }}
          release-name: Production deployment
          template-file: .github/PULL_REQUEST_TEMPLATE/production-release.md
          dry-run: 'true'
          output-file: ${{ runner.temp }}/production-release-notes.md

      - name: Update pull request body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NOTES_FILE: ${{ runner.temp }}/production-release-notes.md
        run: gh pr edit "$PR_NUMBER" --body-file "$NOTES_FILE"
